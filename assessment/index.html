<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2d50"><meta name="robots" content="noindex,nofollow"><title>NPS Accounting Interview Assessment</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--navy:#0b2d50;--navy2:#123f6b;--gold:#c7a33a;--gold2:#e0c46a;--bg:#eef3f8;--card:#fff;--text:#172334;--muted:#697586;--line:#dce4ed;--soft:#f6f8fb;--danger:#b42318}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Cairo',Arial,sans-serif;background:linear-gradient(180deg,#e9f0f7 0,#f7f9fb 42%,#eef3f8 100%);color:var(--text)}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 85% -10%,rgba(199,163,58,.14),transparent 34%),radial-gradient(circle at -10% 20%,rgba(11,45,80,.08),transparent 30%);pointer-events:none}.wrap{position:relative;max-width:780px;margin:auto;padding:18px 14px 38px}.brand{display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.94);border:1px solid rgba(220,228,237,.9);border-radius:24px;padding:18px 20px;box-shadow:0 14px 40px rgba(22,44,72,.08);backdrop-filter:blur(8px)}.logo{width:118px;max-height:92px;object-fit:contain;flex:0 0 auto}.brand h1{margin:0;color:var(--navy);font-size:23px;line-height:1.25;font-weight:800}.brand p{margin:6px 0 0;color:var(--muted);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;margin-top:16px;box-shadow:0 14px 40px rgba(22,44,72,.07)}h2{margin:0 0 18px;color:var(--navy);font-size:21px}.grid{display:grid;gap:13px}.field label{display:block;font-size:12px;font-weight:700;color:#42526a;margin:0 0 6px}.field input{width:100%;height:50px;padding:0 14px;border:1px solid #ccd7e3;border-radius:13px;background:#fff;font:500 15px 'Cairo',Arial,sans-serif;color:var(--text);outline:none;transition:.18s}.field input:focus{border-color:#7796b6;box-shadow:0 0 0 4px rgba(18,63,107,.08)}button{font:700 14px 'Cairo',Arial,sans-serif;border:0;border-radius:13px;min-height:48px;padding:11px 18px;cursor:pointer;transition:.16s}.primary{width:100%;background:linear-gradient(135deg,var(--navy),var(--navy2));color:white;box-shadow:0 7px 18px rgba(11,45,80,.18)}.primary:hover{transform:translateY(-1px)}.primary:disabled{opacity:.6;cursor:not-allowed;transform:none}.hide{display:none!important}.error{min-height:20px;font-size:12px;color:var(--danger);text-align:center}.examHead{position:sticky;top:10px;z-index:4;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:14px;box-shadow:0 8px 26px rgba(22,44,72,.08)}.examTop{display:flex;align-items:center;justify-content:space-between;gap:12px}.counter{font-size:12px;font-weight:700;color:var(--navy);background:#edf3f8;border-radius:999px;padding:7px 10px}.timer{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}.progress{height:7px;background:#e7edf3;border-radius:99px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--navy2),var(--gold));border-radius:99px;transition:width .2s}.questionCard{padding:25px}.topic{font-size:11px;font-weight:700;color:#6b7480;text-transform:uppercase;letter-spacing:.35px;margin-bottom:8px}.qtext{font-size:19px;line-height:1.55;font-weight:700;color:#1b2c41;margin:0 0 18px}.option{display:flex;align-items:flex-start;gap:11px;border:1px solid var(--line);border-radius:15px;padding:14px 15px;margin:10px 0;background:#fff;cursor:pointer;transition:.15s;font-size:14px;line-height:1.45}.option:hover{border-color:#aebdcd;background:#fbfcfe}.option:has(input:checked){border-color:#567da4;background:#f1f6fb;box-shadow:0 0 0 3px rgba(18,63,107,.05)}.option input{accent-color:var(--navy);margin:4px 0 0;flex:0 0 auto}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.secondary{background:#edf2f7;color:var(--navy)}.finish{background:linear-gradient(135deg,#c7a33a,#dfc263);color:#1e2a39}.success{text-align:center;padding:42px 24px}.check{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;background:#eef6f1;color:#16794d;font-size:30px;font-weight:800}.closedIcon{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;background:#f2f4f7;color:#475467;font-size:27px;font-weight:800}.success h2{font-size:23px}.success p{color:var(--muted);font-size:14px;margin:0}@media(max-width:520px){.wrap{padding:10px 10px 28px}.brand{padding:15px;gap:13px;border-radius:19px}.logo{width:88px;max-height:72px}.brand h1{font-size:18px}.brand p{font-size:10px}.card{padding:18px;border-radius:19px}.questionCard{padding:19px}.qtext{font-size:17px}.option{padding:13px;font-size:13px}.examHead{top:6px}.nav{position:sticky;bottom:7px;background:rgba(255,255,255,.95);padding:7px;border-radius:15px;box-shadow:0 8px 24px rgba(22,44,72,.10)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style></head><body><main class="wrap"><header class="brand"><img class="logo" src="api/logo" alt="NPS logo"><div><h1>Accounting Interview Assessment</h1><p>National Projects Services</p></div></header><section id="intro" class="card"><h2>Candidate Details</h2><div class="grid"><div class="field"><label for="name">Full Name</label><input id="name" autocomplete="name" required></div><div class="field"><label for="email">Email Address</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="mobile">Mobile Number</label><input id="mobile" type="tel" autocomplete="tel" inputmode="tel"></div><div class="field"><label for="salary">Expected Monthly Salary (AED)</label><input id="salary" type="number" min="0" step="100" inputmode="numeric" required></div><button id="start" class="primary">Start Assessment</button><div id="err" class="error"></div></div></section><section id="exam" class="hide"><div class="examHead"><div class="examTop"><span id="counter" class="counter"></span><span id="timer" class="timer">00:00:00</span></div><div class="progress"><i id="progress"></i></div></div><div class="card questionCard"><div id="topic" class="topic"></div><div id="qtext" class="qtext"></div><div id="opts"></div><div class="nav"><button id="prev" class="secondary">Previous</button><button id="next" class="finish">Next</button></div></div></section><section id="done" class="card success hide"><div class="check">✓</div><h2>Assessment Completed Successfully</h2><p>Thank you. Your response has been submitted.</p></section><section id="closed" class="card success hide"><div class="closedIcon">—</div><h2>Assessment Unavailable</h2><p>This assessment is no longer available.</p></section></main><script>const EXPIRY=Date.parse('2026-08-24T23:59:59+04:00');let questions=[],answers=[],idx=0,session='',started=0,tick=null;const $=id=>document.getElementById(id);const api=p=>location.hostname==='interview.insight-me.ae'?`/api/${p}`:`/assessment/api/${p}`;function expired(){return Date.now()>EXPIRY}function showClosed(){if(tick)clearInterval(tick);$('intro').classList.add('hide');$('exam').classList.add('hide');$('done').classList.add('hide');$('closed').classList.remove('hide')}function elapsed(){return started?Math.max(0,Math.floor((Date.now()-started)/1000)):0}function fmt(s){return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=questions[idx];$('counter').textContent=`Question ${idx+1} of ${questions.length}`;$('topic').textContent=q.topic;$('qtext').textContent=q.question;$('progress').style.width=`${((idx+1)/questions.length)*100}%`;$('opts').innerHTML=q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${answers[idx]?.shown===i?'checked':''}><span>${escapeHtml(o)}</span></label>`).join('');$('prev').disabled=idx===0;$('next').textContent=idx===questions.length-1?'Finish Assessment':'Next';window.scrollTo({top:0,behavior:'smooth'})}function save(){const c=document.querySelector('input[name=answer]:checked');if(c){const shown=Number(c.value);answers[idx]={shown,original:questions[idx].map[shown]}}}if(expired())showClosed();$('start').onclick=async()=>{if(expired()){showClosed();return}const name=$('name').value.trim(),email=$('email').value.trim(),salary=$('salary').value.trim(),mobile=$('mobile').value.trim();$('err').textContent='';if(!name||!email||!salary){$('err').textContent='Please complete the required fields.';return}if(!/^\S+@\S+\.\S+$/.test(email)){$('err').textContent='Please enter a valid email address.';return}$('start').disabled=true;$('start').textContent='Starting…';try{const r=await fetch(api('start'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,email,mobile,salary})});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to start assessment.');questions=d.questions;session=d.session;answers=Array(questions.length);started=Date.now();$('intro').classList.add('hide');$('exam').classList.remove('hide');tick=setInterval(()=>{if(expired()){showClosed();return}$('timer').textContent=fmt(elapsed())},1000);render()}catch(e){if(expired()){showClosed();return}$('err').textContent=e.message;$('start').disabled=false;$('start').textContent='Start Assessment'}};$('prev').onclick=()=>{save();if(idx>0){idx--;render()}};$('next').onclick=async()=>{if(expired()){showClosed();return}save();if(!answers[idx]){alert('Please select an answer.');return}if(idx<questions.length-1){idx++;render();return}if(answers.some(x=>!x)){alert('Please answer all questions.');return}if(!confirm('Submit your assessment now?'))return;$('next').disabled=true;$('next').textContent='Submitting…';try{const r=await fetch(api('submit'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({session,answers,elapsed:elapsed()})});const d=await r.json();if(!r.ok)throw Error(d.error||'Submission failed.');clearInterval(tick);$('exam').classList.add('hide');$('done').classList.remove('hide');history.replaceState({},document.title,location.pathname)}catch(e){if(expired()){showClosed();return}alert(e.message);$('next').disabled=false;$('next').textContent='Finish Assessment'}};window.addEventListener('beforeunload',e=>{if(started&&!$('exam').classList.contains('hide')){e.preventDefault();e.returnValue=''}});</script></body></html>
