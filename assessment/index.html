<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NPS Accounting Interview Assessment</title><style>:root{--navy:#092d53;--gold:#c9a227;--bg:#f3f6fa;--line:#dce3eb}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#182230}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:22px;margin:14px 0;box-shadow:0 8px 30px #102a4312}.brand{display:flex;align-items:center;gap:18px}.logoimg{width:112px;max-height:94px;object-fit:contain;display:block;flex:0 0 auto}h1{font-size:22px;color:var(--navy);margin:0 0 4px}h2{color:var(--navy)}.muted{color:#667085;font-size:13px}.grid{display:grid;gap:12px}input{width:100%;padding:14px;border:1px solid #cfd7e3;border-radius:12px;font-size:16px}button{border:0;border-radius:12px;background:var(--navy);color:white;padding:14px 18px;font-weight:700;font-size:15px}.gold{background:var(--gold);color:#172033}.hide{display:none}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{background:#edf3f8;border-radius:999px;padding:7px 10px;font-size:12px}.bar{height:8px;background:#e7ecf2;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);width:0}.option{display:block;border:1px solid var(--line);padding:14px;border-radius:13px;margin:10px 0;cursor:pointer}.option:has(input:checked){border-color:var(--navy);background:#f1f6fb}.option input{width:auto;margin-right:10px}.nav{display:flex;justify-content:space-between;margin-top:18px}@media(max-width:500px){.wrap{padding:10px}.card{padding:17px}h1{font-size:19px}.logoimg{width:88px}}</style></head><body><div class="wrap"><div class="card brand"><img class="logoimg" src="/assessment/api/logo" alt="NPS"><div><h1>Accounting Interview Assessment</h1><div class="muted">National Projects Services · Recruitment Assessment</div></div></div>
<section id="intro" class="card"><h2>Candidate Details</h2><div class="grid"><input id="name" placeholder="Full Name *"><input id="email" type="email" placeholder="Email Address *"><input id="mobile" placeholder="Mobile Number"><input id="salary" type="number" placeholder="Expected Monthly Salary (AED) *"><button id="start">Start Assessment</button><div id="err" class="muted"></div></div></section>
<section id="exam" class="hide"><div class="card"><div class="top"><span id="level" class="pill"></span><b id="timer">00:00:00</b></div><div class="bar" style="margin-top:12px"><i id="progress"></i></div></div><div class="card"><div class="muted" id="topic"></div><h2 id="qtext"></h2><div id="opts"></div><div class="nav"><button id="prev">Previous</button><button id="next" class="gold">Next</button></div></div></section>
<section id="done" class="card hide"><h2>Assessment Completed Successfully</h2><p>Thank you. Your assessment has been submitted to NPS Recruitment.</p></section></div><script>
let questions=[],answers=[],idx=0,session='',started=0,tick;const $=id=>document.getElementById(id);function elapsed(){return Math.floor((Date.now()-started)/1000)}function time(s){return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}function render(){const q=questions[idx];$('level').textContent=`Question ${idx+1} / 60 · Level ${q.level} / 4`;$('topic').textContent=q.topic;$('qtext').textContent=q.question;$('progress').style.width=((idx+1)/60*100)+'%';$('opts').innerHTML=q.options.map((o,i)=>`<label class="option"><input type="radio" name="a" value="${i}" ${answers[idx]?.shown===i?'checked':''}>${o}</label>`).join('');$('prev').disabled=idx===0;$('next').textContent=idx===59?'Finish Assessment':'Next'}
$('start').onclick=async()=>{try{$('err').textContent='Starting...';const r=await fetch('/assessment/api/start',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:$('name').value,email:$('email').value,mobile:$('mobile').value,salary:$('salary').value})});const d=await r.json();if(!r.ok)throw Error(d.error);questions=d.questions;session=d.session;answers=Array(60);started=Date.now();$('intro').classList.add('hide');$('exam').classList.remove('hide');tick=setInterval(()=>$('timer').textContent=time(elapsed()),1000);render()}catch(e){$('err').textContent=e.message}};
$('prev').onclick=()=>{save();if(idx>0){idx--;render()}};function save(){const c=document.querySelector('input[name=a]:checked');if(c){const shown=Number(c.value);answers[idx]={shown,original:questions[idx].map[shown]}}}
$('next').onclick=async()=>{save();if(!answers[idx]){alert('Please select an answer.');return}if(idx<59){idx++;render();return}if(answers.some(x=>!x)){alert('Please answer all questions.');return}if(!confirm('Submit your assessment now?'))return;$('next').disabled=true;const r=await fetch('/assessment/api/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({session,answers,elapsed:elapsed()})});const d=await r.json();if(!r.ok){alert(d.error||'Submission failed');$('next').disabled=false;return}clearInterval(tick);$('exam').classList.add('hide');$('done').classList.remove('hide')};
</script></body></html>
