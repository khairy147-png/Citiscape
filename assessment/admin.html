<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NPS Assessment Management</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--n:#0b2d50;--n2:#123f6b;--g:#c7a33a;--bg:#eef3f8;--text:#172334;--mut:#697586;--line:#dce4ed;--soft:#f6f8fb;--green:#137a4f;--red:#b42318;--amber:#b7791f}*{box-sizing:border-box}body{margin:0;font-family:'Cairo',Arial,sans-serif;background:linear-gradient(180deg,#eaf1f7,#f8fafc 42%,#edf3f8);color:var(--text)}.wrap{max-width:1280px;margin:auto;padding:16px}.top,.card{background:#fff;border:1px solid var(--line);box-shadow:0 10px 30px rgba(20,44,72,.055)}.top{border-radius:22px;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:14px}.logo{width:108px;max-height:82px;object-fit:contain}.brand h1{margin:0;color:var(--n);font-size:20px}.muted{color:var(--mut);font-size:11px}.card{border-radius:20px;padding:18px;margin-top:14px}.login{max-width:450px;margin:50px auto}.login input{width:100%;margin:8px 0}.hide{display:none!important}input,select,button{font:600 13px 'Cairo',Arial,sans-serif}input,select{height:44px;border:1px solid #ccd7e3;border-radius:11px;padding:0 12px;background:#fff}button{border:0;border-radius:11px;min-height:42px;padding:9px 14px;cursor:pointer;font-weight:700}.primary{background:linear-gradient(135deg,var(--n),var(--n2));color:#fff}.ghost{background:#edf2f7;color:var(--n)}.danger{background:#fff0ef;color:var(--red)}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.metric{border:1px solid var(--line);border-radius:15px;padding:13px;background:linear-gradient(#fff,#f8fafc)}.metric span{display:block;color:var(--mut);font-size:10px}.metric b{display:block;color:var(--n);font-size:22px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.toolbar input{flex:1;min-width:220px}.tablewrap{margin-top:14px;overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff}.tbl{width:100%;border-collapse:collapse;min-width:980px}.tbl th{background:#f4f7fa;color:var(--n);font-size:11px;text-align:left;padding:11px;border-bottom:1px solid var(--line)}.tbl td{padding:11px;border-bottom:1px solid #edf1f4;font-size:12px;vertical-align:middle}.tbl tr{cursor:pointer}.tbl tbody tr:hover,.tbl tbody tr.selected{background:#f4f8fc}.name{font-weight:800;color:var(--n)}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;background:#edf3f8;color:var(--n)}.good{background:#ecf7f1;color:var(--green)}.mid{background:#fff7e8;color:var(--amber)}.bad{background:#fff0ef;color:var(--red)}.detailbox{margin-top:14px;display:none}.detailhead{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;flex-wrap:wrap}.identity h2{margin:0;color:var(--n)}.identity .contact{margin-top:4px;color:var(--mut);font-size:12px}.scores{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}.score{background:var(--soft);border:1px solid #e5ebf1;border-radius:11px;padding:10px}.score span{font-size:9px;color:var(--mut);display:block}.score b{font-size:16px;color:var(--n)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.panel,.question{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px}.question{font-size:11px;line-height:1.6;margin-top:8px}.dims{display:flex;gap:6px;flex-wrap:wrap}.dim{background:#eef3f8;border-radius:999px;padding:5px 8px;font-size:10px}.correct{color:var(--green);font-weight:700}.incorrect{color:var(--red);font-weight:700}.empty{text-align:center;color:var(--mut);padding:30px}@media(max-width:800px){.summary{grid-template-columns:repeat(2,1fr)}.scores{grid-template-columns:repeat(4,1fr)}.panels{grid-template-columns:1fr}}@media(max-width:520px){.wrap{padding:9px}.logo{width:78px}.brand h1{font-size:15px}.summary,.scores{grid-template-columns:1fr 1fr}.toolbar>*{width:100%!important;flex:auto!important}.actions button{flex:1}}</style></head><body><main class="wrap"><header class="top"><div class="brand"><img class="logo" src="/api/logo" alt="NPS"><div><h1>Assessment Management</h1><div class="muted">Confidential Recruitment Dashboard</div></div></div></header><section id="login" class="card login"><h2>Administrator Access</h2><input id="key" type="password" placeholder="Admin password"><button class="primary" onclick="load()">Open Dashboard</button><div id="msg" class="muted"></div></section><section id="dash" class="hide"><div class="card"><div class="summary"><div class="metric"><span>Completed Assessments</span><b id="total">0</b></div><div class="metric"><span>Average Accounting</span><b id="acct">0%</b></div><div class="metric"><span>Average Cognitive</span><b id="cog">0%</b></div><div class="metric"><span>Average Behavioral</span><b id="beh">0%</b></div><div class="metric"><span>Recommended</span><b id="rec">0</b></div></div></div><div class="card toolbar"><input id="search" placeholder="Search name, mobile, email or recommendation" oninput="renderList()"><select id="filter" onchange="renderList()"><option value="all">All Results</option><option value="recommended">Recommended</option><option value="chief">Chief Accountant</option><option value="senior">Senior Accountant</option><option value="general">General Accountant</option><option value="not">Not Recommended</option></select><select id="sort" onchange="renderList()"><option value="latest">Latest First</option><option value="fit">Highest Hiring Fit</option><option value="accounting">Highest Accounting</option><option value="time">Fastest Completion</option></select><button class="danger" onclick="clearTests()">Clear Test Results</button></div><div class="tablewrap"><table class="tbl"><thead><tr><th>Candidate</th><th>Mobile</th><th>Email</th><th>Expected Salary</th><th>Accounting</th><th>Hiring Fit</th><th>Technical Recommendation</th><th>Hiring Recommendation</th><th>Time</th></tr></thead><tbody id="tbody"></tbody></table></div><section id="detail" class="card detailbox"></section></section></main><script>let admin='',data=[],selected='';const api=p=>`/api/${p}`;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>[Math.floor((s||0)/3600),Math.floor(((s||0)%3600)/60),(s||0)%60].map(x=>String(x).padStart(2,'0')).join(':');const pct=n=>Math.round(Number(n)||0)+'%';const cls=x=>/Recommended/.test(x)&&!/Not Recommended/.test(x)?'good':/Consider/.test(x)?'mid':'bad';async function load(){admin=key.value;try{const r=await fetch(api('results'),{headers:{'x-admin-key':admin}}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load results');data=d.results||[];login.classList.add('hide');dash.classList.remove('hide');metrics();renderList()}catch(e){msg.textContent=e.message}}function avg(k){return data.length?Math.round(data.reduce((a,r)=>a+(+r[k]||0),0)/data.length):0}function metrics(){total.textContent=data.length;acct.textContent=pct(avg('accounting'));cog.textContent=pct(avg('cognitive'));beh.textContent=pct(avg('behavior'));rec.textContent=data.filter(r=>/Recommended/.test(r.hiring)&&!/Not Recommended/.test(r.hiring)).length}function rows(){let q=search.value.toLowerCase(),f=filter.value,a=data.filter(r=>{let h=[r.candidate?.name,r.candidate?.mobile,r.candidate?.email,r.technical,r.hiring].join(' ').toLowerCase();return(!q||h.includes(q))&&(f==='all'||f==='recommended'&&/Recommended/.test(r.hiring)&&!/Not Recommended/.test(r.hiring)||f==='chief'&&/Chief/.test(r.technical)||f==='senior'&&/Senior/.test(r.technical)||f==='general'&&/General/.test(r.technical)||f==='not'&&/Not Recommended/.test(r.hiring))});if(sort.value==='fit')a.sort((x,y)=>y.fit-x.fit);else if(sort.value==='accounting')a.sort((x,y)=>y.accounting-x.accounting);else if(sort.value==='time')a.sort((x,y)=>x.elapsed-y.elapsed);else a.sort((x,y)=>String(y.completedAt).localeCompare(String(x.completedAt)));return a}function renderList(){let a=rows();tbody.innerHTML=a.map(r=>`<tr class="${selected===r.id?'selected':''}" onclick="showDetail('${r.id}')"><td><div class="name">${esc(r.candidate?.name||'—')}</div></td><td>${esc(r.candidate?.mobile||'—')}</td><td>${esc(r.candidate?.email||'—')}</td><td>AED ${Number(r.candidate?.salary||0).toLocaleString('en-US')}</td><td>${pct(r.accounting)}</td><td>${pct(r.fit)}</td><td><span class="badge ${cls(r.technical)}">${esc(r.technical)}</span></td><td><span class="badge ${cls(r.hiring)}">${esc(r.hiring)}</span></td><td>${fmt(r.elapsed)}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">No matching results.</td></tr>';if(selected&&!a.some(r=>r.id===selected)){selected='';detail.style.display='none'}}function showDetail(id){selected=id;renderList();let r=data.find(x=>x.id===id);if(!r)return;let dims=Object.entries(r.dimensions||{}).map(([k,v])=>`<span class="dim">${esc(k)} <b>${pct(v)}</b></span>`).join('');detail.innerHTML=`<div class="detailhead"><div class="identity"><h2>${esc(r.candidate?.name||'Candidate')}</h2><div class="contact">${esc(r.candidate?.mobile||'No mobile')} · ${esc(r.candidate?.email||'No email')} · Expected AED ${Number(r.candidate?.salary||0).toLocaleString('en-US')}/month</div></div><div><span class="badge ${cls(r.technical)}">${esc(r.technical)}</span><br><span class="badge ${cls(r.hiring)}" style="margin-top:6px">${esc(r.hiring)}</span></div></div><div class="scores">${[['Accounting',r.accounting],['General',r.levels?.[1]],['Senior',r.levels?.[2]],['Chief',r.levels?.[3]],['Cognitive',r.cognitive],['Behavioral',r.behavior],['Hiring Fit',r.fit]].map(x=>`<div class="score"><span>${x[0]}</span><b>${pct(x[1])}</b></div>`).join('')}</div><div class="actions"><button class="ghost" onclick="waById('${r.id}')">WhatsApp Summary</button><button class="ghost" onclick="printById('${r.id}')">Print / PDF</button></div><div class="panels"><div class="panel"><b>Candidate Summary</b><div class="muted">Completed: ${new Date(r.completedAt).toLocaleString('en-GB')}<br>Technical correct: ${r.accountingCorrect}/36<br>Completion time: ${fmt(r.elapsed)}<br>Expected salary: AED ${Number(r.candidate?.salary||0).toLocaleString('en-US')}</div></div><div class="panel"><b>Behavioral Dimensions</b><div class="dims">${dims||'<span class="muted">No behavioral data.</span>'}</div></div></div><h3>Question-by-Question Report</h3>${(r.detail||[]).map(q=>`<div class="question"><b>Q${q.n} · ${esc(q.topic)}</b><br>${esc(q.question)}<br>Candidate answer: ${esc(q.candidate)}${q.type==='behavior'?`<br>Behavioral indicator: ${q.score}/${q.max}`:`<br>Correct answer: ${esc(q.correct)}<br><span class="${q.ok?'correct':'incorrect'}">${q.ok?'Correct':'Incorrect'} · ${q.score}/${q.max}</span>`}</div>`).join('')}`;detail.style.display='block';detail.scrollIntoView({behavior:'smooth',block:'start'})}function summary(r){return [`NPS Accounting Interview Assessment`,`Candidate: ${r.candidate?.name||''}`,`Mobile: ${r.candidate?.mobile||''}`,`Email: ${r.candidate?.email||''}`,`Expected Salary: AED ${Number(r.candidate?.salary||0).toLocaleString('en-US')}`,`Time: ${fmt(r.elapsed)}`,`Accounting: ${r.accounting}%`,`General: ${r.levels?.[1]}% · Senior: ${r.levels?.[2]}% · Chief: ${r.levels?.[3]}%`,`Cognitive: ${r.cognitive}% · Behavioral: ${r.behavior}%`,`Hiring Fit: ${r.fit}% — ${r.hiring}`,`Recommendation: ${r.technical}`].join('\n')}function waById(id){let r=data.find(x=>x.id===id);if(!r)return;let u='https://wa.me/971521920555?text='+encodeURIComponent(summary(r));window.open(u,'_blank','noopener')}function printById(id){let r=data.find(x=>x.id===id);if(!r)return;let w=window.open('','_blank');if(!w){alert('Please allow pop-ups for printing.');return}let qs=(r.detail||[]).map(q=>`<div style="padding:9px 0;border-bottom:1px solid #ddd"><b>Q${q.n} · ${esc(q.topic)}</b><br>${esc(q.question)}<br>Candidate: ${esc(q.candidate)}${q.type==='behavior'?`<br>Behavioral indicator: ${q.score}/${q.max}`:`<br>Correct: ${esc(q.correct)} · <b>${q.ok?'Correct':'Incorrect'} (${q.score}/${q.max})</b>`}</div>`).join('');w.document.open();w.document.write(`<html><head><title>NPS Assessment - ${esc(r.candidate?.name||'Candidate')}</title><style>body{font-family:Arial;padding:30px;color:#172334}h1,h2{color:#0b2d50}@media print{button{display:none}}</style></head><body><h1>NPS Accounting Interview Assessment</h1><h2>${esc(r.candidate?.name||'Candidate')}</h2><p>Mobile: ${esc(r.candidate?.mobile||'')}<br>Email: ${esc(r.candidate?.email||'')}<br>Expected Salary: AED ${Number(r.candidate?.salary||0).toLocaleString('en-US')}<br>Time: ${fmt(r.elapsed)}</p><h2>Results</h2><p>Accounting: <b>${r.accounting}%</b> · General ${r.levels?.[1]}% · Senior ${r.levels?.[2]}% · Chief ${r.levels?.[3]}%<br>Cognitive: ${r.cognitive}% · Behavioral: ${r.behavior}% · Hiring Fit: ${r.fit}%<br>Technical Recommendation: <b>${esc(r.technical)}</b><br>Hiring Recommendation: <b>${esc(r.hiring)}</b></p><h2>Question-by-Question Report</h2>${qs}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),700)}async function clearTests(){if(!confirm('Delete all current test sessions and results?'))return;try{const r=await fetch(api('reset'),{method:'POST',headers:{'x-admin-key':admin}}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to clear results');data=[];selected='';metrics();renderList();detail.style.display='none';alert('Test data cleared successfully.')}catch(e){alert(e.message)}}</script></body></html>
