<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NPS Assessment Management</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--n:#0b2d50;--n2:#123f6b;--g:#c7a33a;--bg:#eef3f8;--text:#172334;--mut:#697586;--line:#dce4ed;--soft:#f6f8fb;--green:#137a4f;--red:#b42318;--amber:#b7791f}*{box-sizing:border-box}body{margin:0;font-family:'Cairo',Arial,sans-serif;background:linear-gradient(180deg,#eaf1f7,#f8fafc 42%,#edf3f8);color:var(--text)}.wrap{max-width:1240px;margin:auto;padding:16px}.top,.card,.candidate{background:#fff;border:1px solid var(--line);box-shadow:0 10px 30px rgba(20,44,72,.055)}.top{border-radius:22px;padding:15px 18px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:14px}.logo{width:108px;max-height:82px;object-fit:contain}.brand h1{margin:0;color:var(--n);font-size:20px}.muted{color:var(--mut);font-size:11px}.card{border-radius:20px;padding:18px;margin-top:14px}.login{max-width:450px;margin:50px auto}.login input{width:100%;margin:8px 0}.hide{display:none!important}input,select,button{font:600 13px 'Cairo',Arial,sans-serif}input,select{height:44px;border:1px solid #ccd7e3;border-radius:11px;padding:0 12px;background:#fff}button{border:0;border-radius:11px;min-height:42px;padding:9px 14px;cursor:pointer;font-weight:700}.primary{background:linear-gradient(135deg,var(--n),var(--n2));color:#fff}.ghost{background:#edf2f7;color:var(--n)}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.metric{border:1px solid var(--line);border-radius:15px;padding:13px;background:linear-gradient(#fff,#f8fafc)}.metric span{display:block;color:var(--mut);font-size:10px}.metric b{display:block;color:var(--n);font-size:22px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px}.results{display:grid;gap:12px;margin-top:14px}.candidate{border-radius:18px;overflow:hidden}.head{padding:15px 16px;display:grid;grid-template-columns:1.5fr .8fr auto;gap:12px;align-items:center}.name{font-weight:800;color:var(--n);font-size:16px}.fit{text-align:right}.fit>b{font-size:20px;color:var(--n)}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;background:#edf3f8;color:var(--n)}.good{background:#ecf7f1;color:var(--green)}.mid{background:#fff7e8;color:var(--amber)}.bad{background:#fff0ef;color:var(--red)}.scores{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;padding:0 16px 15px}.score{background:var(--soft);border:1px solid #e5ebf1;border-radius:11px;padding:9px}.score span{font-size:9px;color:var(--mut);display:block}.score b{font-size:15px;color:var(--n)}.actions{display:flex;gap:7px;flex-wrap:wrap;padding:0 16px 15px}.details{display:none;border-top:1px solid var(--line);background:#fbfcfe;padding:16px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:10px}.panel,.question{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;margin-bottom:8px}.dims{display:flex;gap:6px;flex-wrap:wrap}.dim{background:#eef3f8;border-radius:999px;padding:5px 8px;font-size:10px}.question{font-size:11px;line-height:1.6}.correct{color:var(--green);font-weight:700}.incorrect{color:var(--red);font-weight:700}@media(max-width:800px){.summary{grid-template-columns:repeat(2,1fr)}.scores{grid-template-columns:repeat(4,1fr)}.head{grid-template-columns:1fr auto}.panels{grid-template-columns:1fr}}@media(max-width:520px){.wrap{padding:9px}.logo{width:78px}.brand h1{font-size:15px}.summary,.scores{grid-template-columns:1fr 1fr}.head{display:block}.fit{text-align:left;margin-top:10px}.actions button{flex:1}.toolbar>*{width:100%!important;flex:auto!important}}</style></head><body><main class="wrap"><header class="top"><div class="brand"><img class="logo" src="/assessment/api/logo" alt="NPS"><div><h1>Assessment Management</h1><div class="muted">Confidential Recruitment Dashboard</div></div></div></header><section id="login" class="card login"><h2>Administrator Access</h2><input id="key" type="password" placeholder="Admin password"><button class="primary" onclick="load()">Open Dashboard</button><div id="msg" class="muted"></div></section><section id="dash" class="hide"><div class="card"><div class="summary"><div class="metric"><span>Completed Assessments</span><b id="total">0</b></div><div class="metric"><span>Average Accounting</span><b id="acct">0%</b></div><div class="metric"><span>Average Cognitive</span><b id="cog">0%</b></div><div class="metric"><span>Average Behavioral</span><b id="beh">0%</b></div><div class="metric"><span>Recommended</span><b id="rec">0</b></div></div></div><div class="card toolbar"><input id="search" placeholder="Search candidate, email or recommendation" oninput="render()"><select id="filter" onchange="render()"><option value="all">All Results</option><option value="recommended">Recommended</option><option value="chief">Chief Accountant</option><option value="senior">Senior Accountant</option><option value="general">General Accountant</option><option value="not">Not Recommended</option></select><select id="sort" onchange="render()"><option value="latest">Latest First</option><option value="fit">Highest Hiring Fit</option><option value="accounting">Highest Accounting</option><option value="time">Fastest Completion</option></select></div><div id="results" class="results"></div></section></main><script>let admin='',data=[];const api=p=>location.hostname==='interview.insight-me.ae'?`/api/${p}`:`/assessment/api/${p}`;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>[Math.floor((s||0)/3600),Math.floor(((s||0)%3600)/60),(s||0)%60].map(x=>String(x).padStart(2,'0')).join(':');const pct=n=>Math.round(Number(n)||0)+'%';const cls=x=>/Recommended/.test(x)&&!/Not Recommended/.test(x)?'good':/Consider/.test(x)?'mid':'bad';async function load(){admin=document.getElementById('key').value;try{const r=await fetch(api('results'),{headers:{'x-admin-key':admin}}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load results');data=d.results||[];document.getElementById('login').classList.add('hide');document.getElementById('dash').classList.remove('hide');metrics();render()}catch(e){document.getElementById('msg').textContent=e.message}}function avg(k){return data.length?Math.round(data.reduce((a,r)=>a+(+r[k]||0),0)/data.length):0}function metrics(){total.textContent=data.length;acct.textContent=pct(avg('accounting'));cog.textContent=pct(avg('cognitive'));beh.textContent=pct(avg('behavior'));rec.textContent=data.filter(r=>/Recommended/.test(r.hiring)&&!/Not Recommended/.test(r.hiring)).length}function rows(){let q=search.value.toLowerCase(),f=filter.value,a=data.filter(r=>{let h=[r.candidate?.name,r.candidate?.email,r.technical,r.hiring].join(' ').toLowerCase();return(!q||h.includes(q))&&(f==='all'||f==='recommended'&&/Recommended/.test(r.hiring)&&!/Not Recommended/.test(r.hiring)||f==='chief'&&/Chief/.test(r.technical)||f==='senior'&&/Senior/.test(r.technical)||f==='general'&&/General/.test(r.technical)||f==='not'&&/Not Recommended/.test(r.hiring))});if(sort.value==='fit')a.sort((x,y)=>y.fit-x.fit);else if(sort.value==='accounting')a.sort((x,y)=>y.accounting-x.accounting);else if(sort.value==='time')a.sort((x,y)=>x.elapsed-y.elapsed);else a.sort((x,y)=>String(y.completedAt).localeCompare(String(x.completedAt)));return a}function render(){results.innerHTML=rows().map(card).join('')||'<div class="card muted">No matching results.</div>'}function card(r){let id='d'+r.id.replace(/\W/g,''),dims=Object.entries(r.dimensions||{}).map(([k,v])=>`<span class="dim">${esc(k)} <b>${pct(v)}</b></span>`).join('');return `<article class="candidate"><div class="head"><div><div class="name">${esc(r.candidate.name)}</div><div class="muted">${esc(r.candidate.email)} · ${esc(r.candidate.mobile||'No mobile')} · Expected AED ${Number(r.candidate.salary||0).toLocaleString('en-US')}/month</div></div><div><span class="badge ${cls(r.technical)}">${esc(r.technical)}</span></div><div class="fit"><b>${pct(r.fit)}</b><div class="muted">Hiring Fit</div><span class="badge ${cls(r.hiring)}">${esc(r.hiring)}</span></div></div><div class="scores">${[['Accounting',r.accounting],['General',r.levels?.[1]],['Senior',r.levels?.[2]],['Chief',r.levels?.[3]],['Cognitive',r.cognitive],['Behavioral',r.behavior]].map(x=>`<div class="score"><span>${x[0]}</span><b>${pct(x[1])}</b></div>`).join('')}<div class="score"><span>Time</span><b>${fmt(r.elapsed)}</b></div></div><div class="actions"><button class="primary" onclick="toggle('${id}')">Full Report</button><button class="ghost" onclick='wa(${JSON.stringify(JSON.stringify(r))})'>WhatsApp Summary</button><button class="ghost" onclick='printR(${JSON.stringify(JSON.stringify(r))})'>Print / PDF</button></div><div id="${id}" class="details"><div class="panels"><div class="panel"><b>Candidate Summary</b><div class="muted">Completed: ${new Date(r.completedAt).toLocaleString('en-GB')}<br>Technical correct: ${r.accountingCorrect}/36<br>Expected salary: AED ${Number(r.candidate.salary||0).toLocaleString('en-US')}</div></div><div class="panel"><b>Behavioral Dimensions</b><div class="dims">${dims}</div></div></div>${(r.detail||[]).map(q=>`<div class="question"><b>Q${q.n} · ${esc(q.topic)}</b><br>${esc(q.question)}<br>Candidate answer: ${esc(q.candidate)}${q.type==='behavior'?`<br>Behavioral indicator: ${q.score}/${q.max}`:`<br>Correct answer: ${esc(q.correct)}<br><span class="${q.ok?'correct':'incorrect'}">${q.ok?'Correct':'Incorrect'} · ${q.score}/${q.max}</span>`}</div>`).join('')}</div></article>`}function toggle(id){let e=document.getElementById(id);e.style.display=e.style.display==='block'?'none':'block'}function summary(r){return [`NPS Accounting Interview Assessment`,`Candidate: ${r.candidate.name}`,`Expected Salary: AED ${Number(r.candidate.salary||0).toLocaleString('en-US')}`,`Time: ${fmt(r.elapsed)}`,`Accounting: ${r.accounting}%`,`General: ${r.levels[1]}% · Senior: ${r.levels[2]}% · Chief: ${r.levels[3]}%`,`Cognitive: ${r.cognitive}% · Behavioral: ${r.behavior}%`,`Hiring Fit: ${r.fit}% — ${r.hiring}`,`Recommendation: ${r.technical}`].join('\n')}function wa(s){let r=JSON.parse(s);window.open('https://wa.me/971521920555?text='+encodeURIComponent(summary(r)),'_blank')}function printR(s){let r=JSON.parse(s),w=window.open('','_blank'),qs=(r.detail||[]).map(q=>`<div style="padding:9px 0;border-bottom:1px solid #ddd"><b>Q${q.n} · ${esc(q.topic)}</b><br>${esc(q.question)}<br>Candidate: ${esc(q.candidate)}${q.type==='behavior'?`<br>Behavioral indicator: ${q.score}/${q.max}`:`<br>Correct: ${esc(q.correct)} · <b>${q.ok?'Correct':'Incorrect'} (${q.score}/${q.max})</b>`}</div>`).join('');w.document.write(`<html><head><title>NPS Assessment - ${esc(r.candidate.name)}</title><style>body{font-family:Arial;padding:30px;color:#172334}h1,h2{color:#0b2d50}</style></head><body><h1>NPS Accounting Interview Assessment</h1><h2>${esc(r.candidate.name)}</h2><p>Email: ${esc(r.candidate.email)}<br>Mobile: ${esc(r.candidate.mobile||'')}<br>Expected Salary: AED ${Number(r.candidate.salary||0).toLocaleString('en-US')}<br>Time: ${fmt(r.elapsed)}</p><h2>Results</h2><p>Accounting: <b>${r.accounting}%</b> · General ${r.levels[1]}% · Senior ${r.levels[2]}% · Chief ${r.levels[3]}%<br>Cognitive: ${r.cognitive}% · Behavioral: ${r.behavior}% · Hiring Fit: ${r.fit}%<br>Technical Recommendation: <b>${esc(r.technical)}</b><br>Hiring Recommendation: <b>${esc(r.hiring)}</b></p><h2>Question-by-Question Report</h2>${qs}</body></html>`);w.document.close();setTimeout(()=>w.print(),300)}</script></body></html>
