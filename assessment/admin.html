<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b2d50"><title>NPS Assessment Management</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--n:#0b2d50;--n2:#123f6b;--g:#c7a33a;--bg:#eef3f8;--card:#fff;--text:#172334;--mut:#697586;--line:#dce4ed;--soft:#f6f8fb;--green:#137a4f;--red:#b42318;--amber:#b7791f}*{box-sizing:border-box}body{margin:0;font-family:'Cairo',Arial,sans-serif;background:linear-gradient(180deg,#eaf1f7,#f7f9fb 40%,#edf3f8);color:var(--text)}.wrap{max-width:1240px;margin:auto;padding:16px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:15px 18px;box-shadow:0 12px 34px rgba(20,44,72,.07)}.brand{display:flex;align-items:center;gap:14px}.logo{width:108px;max-height:82px;object-fit:contain}.brand h1{font-size:20px;color:var(--n);margin:0}.brand p{font-size:11px;color:var(--mut);margin:4px 0 0}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 10px 30px rgba(20,44,72,.055)}.login{max-width:460px;margin:50px auto}.login h2{margin:0 0 14px;color:var(--n)}input,select,button{font:600 13px 'Cairo',Arial,sans-serif}input,select{height:44px;border:1px solid #ccd7e3;border-radius:11px;padding:0 12px;background:white;color:var(--text);outline:none}input:focus,select:focus{border-color:#7897b7;box-shadow:0 0 0 3px rgba(18,63,107,.07)}button{border:0;border-radius:11px;min-height:42px;padding:9px 14px;cursor:pointer;font-weight:700}.primary{background:linear-gradient(135deg,var(--n),var(--n2));color:white}.gold{background:linear-gradient(135deg,#c7a33a,#dfc263);color:#1d2836}.ghost{background:#edf2f7;color:var(--n)}.danger{color:var(--red);font-size:12px}.hide{display:none!important}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.metric{background:linear-gradient(180deg,#fff,#f8fafc);border:1px solid var(--line);border-radius:15px;padding:13px}.metric span{display:block;color:var(--mut);font-size:11px}.metric b{display:block;color:var(--n);font-size:22px;margin-top:2px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.toolbar input{flex:1;min-width:210px}.results{display:grid;gap:12px;margin-top:14px}.candidate{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 22px rgba(20,44,72,.045)}.candidateHead{padding:15px 16px;display:grid;grid-template-columns:minmax(220px,1.4fr) minmax(180px,.8fr) auto;gap:12px;align-items:center}.name{font-weight:800;color:var(--n);font-size:16px}.sub{color:var(--mut);font-size:11px;margin-top:3px}.fit{text-align:right}.fit b{font-size:20px;color:var(--n)}.badge{display:inline-block;margin-top:4px;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:700;background:#edf3f8;color:var(--n)}.badge.good{background:#ecf7f1;color:var(--green)}.badge.mid{background:#fff7e8;color:var(--amber)}.badge.bad{background:#fff0ef;color:var(--red)}.scores{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;padding:0 16px 15px}.score{background:var(--soft);border:1px solid #e5ebf1;border-radius:11px;padding:9px}.score span{font-size:9px;color:var(--mut);display:block}.score b{font-size:15px;color:var(--n)}.actions{display:flex;flex-wrap:wrap;gap:7px;padding:0 16px 15px}.details{display:none;border-top:1px solid var(--line);background:#fbfcfe;padding:16px}.detailTop{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.panel{border:1px solid var(--line);background:white;border-radius:13px;padding:12px}.panel h4{margin:0 0 8px;color:var(--n);font-size:13px}.dims{display:flex;gap:6px;flex-wrap:wrap}.dim{background:#eef3f8;color:#354a62;border-radius:999px;padding:5px 8px;font-size:10px}.question{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;margin:8px 0;font-size:11px;line-height:1.55}.question b{color:var(--n)}.correct{color:var(--green);font-weight:700}.incorrect{color:var(--red);font-weight:700}.empty{text-align:center;padding:38px;color:var(--mut)}@media(max-width:900px){.summary{grid-template-columns:repeat(2,1fr)}.scores{grid-template-columns:repeat(4,1fr)}.candidateHead{grid-template-columns:1fr auto}.candidateHead>div:nth-child(2){grid-column:1/-1}.fit{grid-column:2;grid-row:1}.detailTop{grid-template-columns:1fr}}@media(max-width:560px){.wrap{padding:9px}.topbar{border-radius:17px;padding:12px}.logo{width:78px}.brand h1{font-size:15px}.brand p{font-size:9px}.summary{grid-template-columns:1fr 1fr}.metric b{font-size:18px}.scores{grid-template-columns:repeat(2,1fr)}.candidateHead{display:block}.fit{text-align:left;margin-top:10px}.actions button{flex:1}.toolbar input,.toolbar select{width:100%;flex:auto}}</style></head><body><main class="wrap"><header class="topbar"><div class="brand"><img class="logo" src="/assessment/api/logo" alt="NPS"><div><h1>Assessment Management</h1><p>Confidential Recruitment Dashboard</p></div></div><div id="adminUser" class="sub hide">NPS Finance Recruitment</div></header><section id="login" class="card login"><h2>Administrator Access</h2><div style="display:grid;gap:10px"><input id="key" type="password" placeholder="Admin password" autocomplete="current-password"><button class="primary" onclick="loadResults()">Open Dashboard</button><div id="loginMsg" class="danger"></div></div></section><section id="dashboard" class="hide"><div class="card"><div class="summary"><div class="metric"><span>Completed Assessments</span><b id="mTotal">0</b></div><div class="metric"><span>Average Accounting</span><b id="mAccounting">0%</b></div><div class="metric"><span>Average Cognitive</span><b id="mCognitive">0%</b></div><div class="metric"><span>Average Behavioral</span><b id="mBehavior">0%</b></div><div class="metric"><span>Recommended</span><b id="mRecommended">0</b></div></div></div><div class="card"><div class="toolbar"><input id="search" placeholder="Search candidate, email or recommendation" oninput="render()"><select id="filter" onchange="render()"><option value="all">All Results</option><option value="recommended">Recommended</option><option value="chief">Chief Accountant</option><option value="senior">Senior Accountant</option><option value="general">General Accountant</option><option value="not">Not Recommended</option></select><select id="sort" onchange="render()"><option value="latest">Latest First</option><option value="fit">Highest Hiring Fit</option><option value="accounting">Highest Accounting</option><option value="time">Fastest Completion</option></select></div></div><div id="results" class="results"></div></section></main><script>let admin='',data=[];const api=p=>location.hostname==='interview.insight-me.ae'?`/api/${p}`:`/assessment/api/${p}`;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>[Math.floor((s||0)/3600),Math.floor(((s||0)%3600)/60),(s||0)%60].map(x=>String(x).padStart(2,'0')).join(':');const pct=n=>`${Math.round(Number(n)||0)}%`;function badgeClass(x){if(/Highly Recommended|Recommended/.test(x)&&!/Not Recommended/.test(x))return'good';if(/Consider/.test(x))return'mid';return'bad'}async function loadResults(){admin=document.getElementById('key').value;document.getElementById('loginMsg').textContent='';try{const r=await fetch(api('results'),{headers:{'x-admin-key':admin}});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load results.');data=d.results||[];document.getElementById('login').classList.add('hide');document.getElementById('dashboard').classList.remove('hide');document.getElementById('adminUser').classList.remove('hide');metrics();render()}catch(e){document.getElementById('loginMsg').textContent=e.message}}function avg(k){return data.length?Math.round(data.reduce((a,r)=>a+(Number(r[k])||0),0)/data.length):0}function metrics(){document.getElementById('mTotal').textContent=data.length;document.getElementById('mAccounting').textContent=pct(avg('accounting'));document.getElementById('mCognitive').textContent=pct(avg('cognitive'));document.getElementById('mBehavior').textContent=pct(avg('behavior'));document.getElementById('mRecommended').textContent=data.filter(r=>/Recommended/.test(r.hiring)&&!/Not Recommended/.test(r.hiring)).length}function filtered(){const q=document.getElementById('search').value.toLowerCase().trim(),f=document.getElementById('filter').value,s=document.getElementById('sort').value;let a=data.filter(r=>{const hay=[r.candidate?.name,r.candidate?.email,r.technical,r.hiring].join(' ').toLowerCase();if(q&&!hay.includes(q))return false;if(f==='recommended'&&!(/Recommended/.test(r.hiring)&&!/Not Recommended/.test(r.hiring)))return false;if(f==='chief'&&!/Chief Accountant/.test(r.technical))return false;if(f==='senior'&&!/Senior Accountant/.test(r.technical))return false;if(f==='general'&&!/General Accountant/.test(r.technical))return false;if(f==='not'&&!/Not Recommended/.test(r.hiring))return false;return true});if(s==='fit')a.sort((x,y)=>y.fit-x.fit);else if(s==='accounting')a.sort((x,y)=>y.accounting-x.accounting);else if(s==='time')a.sort((x,y)=>x.elapsed-y.elapsed);else a.sort((x,y)=>String(y.completedAt).localeCompare(String(x.completedAt)));return a}function render(){const box=document.getElementById('results'),rows=filtered();if(!rows.length){box.innerHTML='<div class="card empty">No matching assessment results.</div>';return}box.innerHTML=rows.map(card).join('')}function card(r){const id='d'+String(r.id).replace(/[^a-zA-Z0-9]/g,'');const dims=Object.entries(r.dimensions||{}).map(([k,v])=>`<span class="dim">${esc(k)} <b>${pct(v)}</b></span>`).join('');return `<article class="candidate"><div class="candidateHead"><div><div class="name">${esc(r.candidate?.name)}</div><div class="sub">${esc(r.candidate?.email)} · ${esc(r.candidate?.mobile||'No mobile')} · Expected Salary AED ${Number(r.candidate?.salary||0).toLocaleString('en-US')}</div></div><div><span class="badge ${badgeClass(r.technical)}">${esc(r.technical)}</span></div><div class="fit"><b>${pct(r.fit)}</b><div class="sub">Hiring Fit</div><span class="badge ${badgeClass(r.hiring)}">${esc(r.hiring)}</span></div></div><div class="scores"><div class="score"><span>Accounting</span><b>${pct(r.accounting)}</b></div><div class="score"><span>General</span><b>${pct(r.levels?.[1])}</b></div><div class="score"><span>Senior</span><b>${pct(r.levels?.[2])}</b></div><div class="score"><span>Chief</span><b>${pct(r.levels?.[3])}</b></div><div class="score"><span>Cognitive</span><b>${pct(r.cognitive)}</b></div><div class="score"><span>Behavioral</span><b>${pct(r.behavior)}</b></div><div class="score"><span>Time</span><b>${fmt(r.elapsed)}</b></div></div><div class="actions"><button class="ghost" onclick="toggle('${id}')">Full Report</button><button class="gold" onclick='emailReport(${JSON.stringify(JSON.stringify(r))})'>Email Full Report</button><button class="ghost" onclick='whatsApp(${JSON.stringify(JSON.stringify(r))})'>WhatsApp Summary</button><button class="ghost" onclick='printReport(${JSON.stringify(JSON.stringify(r))})'>Print / PDF</button></div><div class="details" id="${id}"><div class="detailTop"><div class="panel"><h4>Candidate Summary</h4><div class="sub">Completed: ${new Date(r.completedAt).toLocaleString('en-GB')}<br>Correct technical answers: ${r.accountingCorrect}/36<br>Expected monthly salary: AED ${Number(r.candidate?.salary||0).toLocaleString('en-US')}</div></div><div class="panel"><h4>Behavioral Dimensions</h4><div class="dims">${dims||'<span class="sub">No behavioral dimensions available.</span>'}</div></div></div>${(r.detail||[]).map(q=>`<div class="question"><b>Q${q.n} · ${q.level<=3?'Accounting Level '+q.level:'Cognitive & Workplace Behavior'} · ${esc(q.topic)}</b><br>${esc(q.question)}<br><span>Candidate answer: ${esc(q.candidate)}</span>${q.type==='behavior'?`<br><span>Behavioral indicator: ${q.score}/${q.max}</span>`:`<br><span>Correct answer: ${esc(q.correct)}</span><br><span class="${q.ok?'correct':'incorrect'}">${q.ok?'Correct':'Incorrect'} · ${q.score}/${q.max}</span>`}</div>`).join('')}</div></article>`}function toggle(id){const e=document.getElementById(id);e.style.display=e.style.display==='block'?'none':'block'}function reportText(r,full=true){const dims=Object.entries(r.dimensions||{}).map(([k,v])=>`${k}: ${v}%`).join(' | ');let a=['NPS ACCOUNTING INTERVIEW ASSESSMENT','===================================',`Candidate: ${r.candidate.name}`,`Email: ${r.candidate.email}`,`Mobile: ${r.candidate.mobile||'Not provided'}`,`Expected Monthly Salary: AED ${Number(r.candidate.salary||0).toLocaleString('en-US')}`,`Completion Time: ${fmt(r.elapsed)}`,'',`ACCOUNTING TECHNICAL: ${r.accounting}% (${r.accountingCorrect}/36)`,`General Accountant: ${r.levels[1]}%`,`Senior Accountant: ${r.levels[2]}%`,`Chief Accountant: ${r.levels[3]}%`,`Technical Recommendation: ${r.technical}`,'',`COGNITIVE: ${r.cognitive}%`,`BEHAVIORAL: ${r.behavior}%`,`Behavioral Dimensions: ${dims}`,`HIRING FIT: ${r.fit}% — ${r.hiring}`];if(full){a.push('','QUESTION-BY-QUESTION REPORT','---------------------------');(r.detail||[]).forEach(q=>{a.push('',`Q${q.n} | ${q.topic}`,q.question,`Candidate: ${q.candidate}`);if(q.type==='behavior')a.push(`Behavioral indicator: ${q.score}/${q.max}`);else a.push(`Correct: ${q.correct}`,`${q.ok?'CORRECT':'INCORRECT'} | ${q.score}/${q.max}`)})}return a.join('\n')}function emailReport(s){const r=JSON.parse(s);const subject=`NPS Assessment Report — ${r.candidate.name}`;location.href=`mailto:M.mohamed@nps.ae?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(reportText(r,true))}`}function whatsApp(s){const r=JSON.parse(s);window.open(`https://wa.me/971521920555?text=${encodeURIComponent(reportText(r,false))}`,'_blank')}function printReport(s){const r=JSON.parse(s),w=window.open('','_blank');w.document.write(`<html><head><title>NPS Assessment - ${esc(r.candidate.name)}</title><style>body{font-family:Arial;padding:28px;line-height:1.5;color:#172334}h1{color:#0b2d50}.q{border-top:1px solid #ddd;padding:10px 0;font-size:12px}@media print{button{display:none}}</style></head><body><h1>NPS Accounting Interview Assessment</h1><pre style="white-space:pre-wrap;font-family:Arial">${esc(reportText(r,false))}</pre><h2>Question-by-Question Report</h2>${(r.detail||[]).map(q=>`<div class="q"><b>Q${q.n} · ${esc(q.topic)}</b><br>${esc(q.question)}<br>Candidate: ${esc(q.candidate)}${q.type==='behavior'?`<br>Behavioral indicator: ${q.score}/${q.max}`:`<br>Correct: ${esc(q.correct)}<br>${q.ok?'Correct':'Incorrect'} · ${q.score}/${q.max}`}</div>`).join('')}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),250)}</script></body></html>
