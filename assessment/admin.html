<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NPS Assessment Admin</title><style>:root{--n:#092d53;--g:#c9a227;--l:#dce3eb}*{box-sizing:border-box}body{font-family:Arial;background:#f3f6fa;margin:0;color:#172033}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:18px;margin:12px 0}.top{display:flex;justify-content:space-between;align-items:center}.logoimg{width:105px;max-height:90px;object-fit:contain;display:block}input,button{padding:12px;border-radius:10px;border:1px solid var(--l)}button{background:var(--n);color:white;border:0;font-weight:bold}.gold{background:var(--g);color:#172033}.result{border-top:1px solid var(--l);padding:14px 0}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.k{background:#f7f9fc;border:1px solid var(--l);border-radius:12px;padding:10px}.details{display:none}.q{padding:9px;border-bottom:1px solid #edf0f4;font-size:13px}.muted{color:#667085;font-size:12px}@media(max-width:600px){.top{align-items:flex-start;gap:10px}.card{padding:14px}.logoimg{width:82px}}</style></head><body><div class="wrap"><div class="card top"><img class="logoimg" src="/assessment/api/logo" alt="NPS"><div><b>Assessment Administration</b><div class="muted">Confidential Recruitment Results</div></div></div><div id="login" class="card"><h3>Administrator Access</h3><input id="key" type="password" placeholder="Admin password"><button onclick="load()">Open Results</button><div id="msg" class="muted"></div></div><div id="results"></div></div><script>
let admin='';const fmt=s=>[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':');async function load(){admin=document.getElementById('key').value;const r=await fetch('/assessment/api/results',{headers:{'x-admin-key':admin}});const d=await r.json();if(!r.ok){document.getElementById('msg').textContent=d.error;return}document.getElementById('login').style.display='none';document.getElementById('results').innerHTML=d.results.length?d.results.map(card).join(''):'<div class="card">No completed assessments yet.</div>'}
function card(r){const dims=Object.entries(r.dimensions||{}).map(([k,v])=>`${k}: <b>${v}%</b>`).join(' · ');return `<div class="card result"><div class="top"><div><h3>${esc(r.candidate.name)}</h3><div class="muted">${esc(r.candidate.email)} · ${esc(r.candidate.mobile||'No mobile')} · Expected AED ${esc(r.candidate.salary)}/month</div></div><b>${r.fit}% · ${r.hiring}</b></div><div class="kpis"><div class="k">Accounting<br><b>${r.accounting}%</b></div><div class="k">General<br><b>${r.levels[1]}%</b></div><div class="k">Senior<br><b>${r.levels[2]}%</b></div><div class="k">Chief<br><b>${r.levels[3]}%</b></div><div class="k">Cognitive<br><b>${r.cognitive}%</b></div><div class="k">Behavioral<br><b>${r.behavior}%</b></div><div class="k">Time<br><b>${fmt(r.elapsed)}</b></div></div><p><b>Technical:</b> ${r.technical}<br><b>Hiring Fit:</b> ${r.hiring}<br><span class="muted">${dims}</span></p><button onclick="toggle('${r.id}')">Full Report</button> <button class="gold" onclick='mail(${JSON.stringify(JSON.stringify(r))})'>Email Full Report</button> <button class="gold" onclick='wa(${JSON.stringify(JSON.stringify(r))})'>WhatsApp Summary</button><div class="details" id="${r.id}">${r.detail.map(q=>`<div class="q"><b>Q${q.n} · L${q.level} · ${esc(q.topic)}</b><br>${esc(q.question)}<br>Candidate: ${esc(q.candidate)}${q.type==='behavior'?`<br>Behavioral score: ${q.score}/${q.max}`:`<br>Correct: ${esc(q.correct)}<br><b>${q.ok?'Correct':'Incorrect'} · ${q.score}/${q.max}</b>`}</div>`).join('')}</div></div>`}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toggle(id){const e=document.getElementById(id);e.style.display=e.style.display==='block'?'none':'block'}function text(r,full=false){let a=[`NPS ACCOUNTING INTERVIEW ASSESSMENT`,`Candidate: ${r.candidate.name}`,`Email: ${r.candidate.email}`,`Expected Salary: AED ${r.candidate.salary}/month`,`Time: ${fmt(r.elapsed)}`,``,`Accounting: ${r.accounting}% (${r.accountingCorrect}/36)`,`General: ${r.levels[1]}%`,`Senior: ${r.levels[2]}%`,`Chief: ${r.levels[3]}%`,`Technical Recommendation: ${r.technical}`,``,`Cognitive: ${r.cognitive}%`,`Behavioral: ${r.behavior}%`,`Hiring Fit: ${r.fit}% — ${r.hiring}`];if(full){a.push('','QUESTION-BY-QUESTION REPORT');r.detail.forEach(q=>a.push('',`Q${q.n} | L${q.level} | ${q.topic}`,q.question,`Candidate: ${q.candidate}`,q.type==='behavior'?`Behavioral score: ${q.score}/${q.max}`:`Correct: ${q.correct}\n${q.ok?'CORRECT':'INCORRECT'} | ${q.score}/${q.max}`))}return a.join('\n')}function mail(s){const r=JSON.parse(s);location.href='mailto:M.mohamed@nps.ae?subject='+encodeURIComponent('NPS Assessment — '+r.candidate.name)+'&body='+encodeURIComponent(text(r,true))}function wa(s){const r=JSON.parse(s);window.open('https://wa.me/971521920555?text='+encodeURIComponent(text(r,false)),'_blank')}
</script></body></html>
